version: '3.8'




services:

  # ---------------------------------------------------------------------------
  # 5. AUTOMATED INFRASTRUCTURE PROVISIONER (Runs once on startup)
  # ---------------------------------------------------------------------------
  init-infra:
    image: bitnami/kafka:3.6.1 # Reusing the Kafka image since it contains bash and kafka tools
    container_name: sentinel-init-infra
    user: root # Ensuring execution rights to install the MinIO client binary on the fly
    volumes:
      - ./init-infra.sh:/usr/local/bin/init-infra.sh:ro
    entrypoint: [ "/bin/bash", "-c" ]
    command: >
      "
      curl -s https://min.io -o /usr/local/bin/mc && \
      chmod +x /usr/local/bin/mc && \
      /usr/local/bin/init-infra.sh
      "
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 1. MESSAGE BROKER: Apache Kafka (KRaft mode, no Zookeeper required)
  # ---------------------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.6.1
    container_name: sentinel-kafka
    ports:
      - "9092:9092"   # Internal/Docker network broker traffic
      - "9094:9094"   # External host machine traffic (your local IDE/Python scripts)
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # UI for managing Kafka topics and monitoring consumer lags
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sentinel-kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 2. DEAD LETTER QUEUE LOG: MinIO (S3 Compatible Storage)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: sentinel-minio
    ports:
      - "9000:9000"   # API Port for PySpark/Boto3 integration
      - "9001:9001"   # Web Console UI
    environment:
      - MINIO_ROOT_USER=sentinel_admin
      - MINIO_ROOT_PASSWORD=sentinel_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 3. OLAP TIME-SERIES DB: ClickHouse
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: sentinel-clickhouse
    ports:
      - "8123:8123"   # HTTP Interface (for Grafana and PySpark ClickHouse Connectors)
      - "9000:9000"   # Native Client TCP Port
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=sentinel_db
      - CLICKHOUSE_USER=sentinel_user
      - CLICKHOUSE_PASSWORD=sentinel_password
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 4. OBSERVABILITY: Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    ports:
      - "3000:3000"   # Dashboard Access
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - clickhouse

# -----------------------------------------------------------------------------
# PERSISTENT STORAGE VOLUMES
# -----------------------------------------------------------------------------
volumes:
  kafka_data:
    driver: local
  minio_data:
    driver: local
  clickhouse_data:
    driver: local
  grafana_data:
    driver: local


